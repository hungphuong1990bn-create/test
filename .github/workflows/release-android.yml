# ════════════════════════════════════════════════════════════
# QUAN TRỌNG: File này phải nằm ở .github/workflows/release-android.yml
# TẠI GỐC REPO (ngang hàng với file release-desktop.yml đã có), KHÔNG
# nằm trong thư mục android-app/. GitHub Actions chỉ đọc workflow từ
# .github/workflows/ ở gốc repo.
#
# Build file .apk (bản debug, tự ký bằng key debug mặc định của
# Android — cài trực tiếp lên điện thoại được, không cần Play Store,
# không cần tài khoản Google Developer). Kích hoạt bằng cách push tag
# dạng "android-v*", ví dụ: android-v1.0.0
# ════════════════════════════════════════════════════════════
name: Build & Release Android APK

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor native project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      # Gắn đúng số phiên bản từ tag (vd tag "android-v1.0.1" -> versionName "1.0.1")
      # vào app/build.gradle, để app tự báo cáo đúng phiên bản thật của mình qua
      # Capacitor App.getInfo() — đoạn code kiểm tra bản mới trong index.html dựa
      # vào con số này để so sánh với bản mới nhất trên GitHub Releases.
      - name: Set app version from tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NAME="${TAG_NAME#android-v}"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk QuanLySXDongPhuong.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android-app/QuanLySXDongPhuong.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
